  <text x="100" y="507" font-size="20" fill="#1a1a2e">✓ T13 data-quality cross-tool gap closed — ctruncate (05-04)</text>
  <rect x="80" y="530" width="850" height="40" rx="6" fill="#dff0e1"/>
  <text x="100" y="557" font-size="20" fill="#1a1a2e">✓ T03 strengthened — Servalcat sigmaa direct R-work/R-free, 4-tool bracket (NEW 05-05)</text>
