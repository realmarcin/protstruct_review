  <text x="391" y="894" font-size="18" font-weight="600" fill="#1a1a2e">R-free gap &lt; 0.05</text>
  <text x="391" y="924" font-size="17" fill="#a8201a" font-weight="700">⚠ 3 of 4 oracles fail</text>
  <rect x="672" y="850" width="276" height="100" rx="10" fill="#ffffff" stroke="#b07c00" stroke-width="2"/>
  <text x="687" y="894" font-size="18" font-weight="600" fill="#1a1a2e">Ramachandran &lt; 1%</text>
  <text x="687" y="924" font-size="17" fill="#b07c00" font-weight="700">✓ headline wrong</text>
  <rect x="968" y="850" width="276" height="100" rx="10" fill="#ffffff" stroke="#1f7a3f" stroke-width="2"/>
  <text x="983" y="894" font-size="18" font-weight="600" fill="#1a1a2e">Clashscore &lt; 5</text>
  <text x="983" y="924" font-size="17" fill="#1f7a3f" font-weight="700">✓ pass</text>
  <rect x="1264" y="850" width="276" height="100" rx="10" fill="#ffffff" stroke="#a8201a" stroke-width="2"/>
  <text x="1279" y="894" font-size="18" font-weight="600" fill="#1a1a2e">No Δρ &gt; 4σ</text>
  <text x="1279" y="924" font-size="17" fill="#a8201a" font-weight="700">✗ fails</text>
  <rect x="1560" y="850" width="276" height="100" rx="10" fill="#ffffff" stroke="#1f7a3f" stroke-width="2"/>
  <text x="1575" y="894" font-size="18" font-weight="600" fill="#1a1a2e">Data quality (T13)</text>
