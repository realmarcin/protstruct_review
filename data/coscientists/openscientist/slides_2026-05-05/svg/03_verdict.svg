  <rect x="80" y="180" width="1760" height="120" rx="10" fill="#dce6f4" stroke="#1f4e8c" stroke-width="2"/>
  <text x="120" y="240" font-size="32" font-weight="700" fill="#1a1a2e">1SAR is a real and substantial improvement over the tutorial-derived starting model.</text>
  <text x="120" y="278" font-size="22" fill="#5a6071">Modelling decisions on structure, geometry, ion identity (Mg²⁺ excluded), water, disulfides — all defensible.</text>
  <text x="80" y="350" font-size="26" font-weight="700" fill="#1f7a3f">Closed across the 04-30 / 05-01 / 05-04 / 05-05 re-issues</text>
