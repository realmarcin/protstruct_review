  <rect x="80" y="660" width="1760" height="100" rx="10" fill="#fbeecb" stroke="#b07c00" stroke-width="2"/>
  <text x="100" y="700" font-size="22" font-weight="700" fill="#1a1a2e">K⁺ alternative for both ions</text>
  <text x="100" y="734" font-size="20" fill="#1a1a2e">K⁺ has the best raw bond-length fit (|Z| 0.13–0.44) but coordination number is too low for K⁺ canonical, and the protein is a known Ca²⁺ enzyme. Needs crystallisation buffer information.</text>
  <text x="80" y="820" font-size="26" font-weight="700" fill="#1f4e8c">Net acceptance against agent’s own success criteria — 3 / 6 pass cleanly</text>
