  <rect x="980" y="380" width="860" height="40" rx="6" fill="#f5d6d4"/>
  <text x="1000" y="407" font-size="20" fill="#1a1a2e">✗ R-free reproducibly ≈ 0.21 (4-tool bracket), agent reports 0.199</text>
  <rect x="980" y="430" width="860" height="40" rx="6" fill="#f5d6d4"/>
  <text x="1000" y="457" font-size="20" fill="#1a1a2e">✗ Round 6 R-free 0.207 &lt; round 7 R-free 0.212</text>
  <rect x="980" y="480" width="860" height="40" rx="6" fill="#f5d6d4"/>
  <text x="1000" y="507" font-size="20" fill="#1a1a2e">✗ Asn A 39 is a Ramachandran outlier</text>
  <rect x="980" y="530" width="860" height="40" rx="6" fill="#f5d6d4"/>
  <text x="1000" y="557" font-size="20" fill="#1a1a2e">✗ Density-peak inventory incomplete (23+ / 8− vs 9 listed)</text>
