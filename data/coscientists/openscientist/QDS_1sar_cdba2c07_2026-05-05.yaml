  assumptions_report:
  - id: ASSUM_tmalign_tm_score_normaliser
    kind: implicit
    scope: tool
    title: TM-score is normalised by the FIRST input length
    description: '`TMalign A.pdb B.pdb` normalises TM-score by the length of A. Swapping
      arguments swaps the normaliser and produces a slightly different score.'
    consequences: Reporting "TM-score = 0.987" without identifying which input was
      first leaves a 0.5–2 % ambiguity.
    mitigation: Always state which structure was the reference (the normaliser); record
      both TM-scores when chains have different lengths.
    status: mitigated
    tool_ref: TM-align
  - id: ASSUM_tmalign_optimal_alignment_drops_residues
    kind: explicit
    scope: tool
    title: Sequence-independent — optimal Cα subset
    description: TM-align finds the optimal Cα subset by dynamic programming and drops
      residues from the score that don't fit the alignment. The `Aligned length` field
      tells you how many were used.
    consequences: For near-identical structures TM-align produces a more generous
      alignment than LSQ-based superposition. RMSD reported next to a TM-align alignment
      is over a different atom set than RMSD reported next to a phenix.superpose_models
      alignment.
    mitigation: Quote `aligned_length` in PairwiseComparison.residues_aligned. Quote
      both LSQ and TM-align RMSD when reporting both.
    status: mitigated
    tool_ref: TM-align
  - id: ASSUM_phenix_mvd_treats_model_as_fixed
    kind: explicit
    scope: tool
    title: Model is fixed; not a refinement
    description: '`phenix.model_vs_data` re-computes R-factors with its own bulk-
      solvent fit but does not move atoms. The R-factors it reports are for the input
      model exactly as deposited.'
    consequences: A model that converged in PHENIX with one scaling will look slightly
      different here. Treat the model_vs_data value as the catalog T06 oracle of record.
    mitigation: None needed; this is the intended behaviour.
    status: verified
    tool_ref: phenix.model_vs_data
  - id: ASSUM_gemmi_sfcalc_simpler_bulk_solvent
    kind: explicit
    scope: tool
    title: Flat-bulk solvent, no anisotropic scaling
    description: '`scripts/gemmi_rfactor.py` uses a flat-bulk solvent + bin-wise isotropic
      rescaling. PHENIX uses anisotropic scaling on top of a Babinet-style bulk-solvent
      fit.'
    consequences: Expect 0.005–0.015 higher R-work from gemmi than from PHENIX on
      the same data — that is the price of an independent code path. Do NOT report
      the gemmi number as the agent's claim being wrong; report the bracket between
      the two.
    mitigation: Cite both numbers in the QDS notes. Use the larger Δ as the conservative
      bound.
    status: mitigated
    tool_ref: gemmi sfcalc
  - id: ASSUM_gemmi_sfcalc_linear_resolution_shells
    kind: implicit
    scope: tool
    title: Linearly-binned resolution shells
    description: The custom R-calc bins reflections by 1/d² in equal-count bins; PHENIX
      uses adaptive shells.
    consequences: Per-shell R numbers are not directly comparable across the two tools.
    mitigation: Use overall R-work / R-free for cross-tool comparison, not per-shell.
    status: mitigated
    tool_ref: gemmi sfcalc
  - id: ASSUM_servalcat_sigmaa_per_shell_only
    kind: explicit
    scope: tool
    title: per-shell sigma-A R, not work/free split by default
    description: '`servalcat sigmaa` reports a per-shell composite R and per-bin sigma-A
      weights, not a separately-cross-validated R-work / R-free. The "overall R" we
      surface is a reflection-count-weighted mean over the shells.'
    consequences: Treating the Servalcat number as a direct R-free substitute is incorrect
      — it is a different quantity.
    mitigation: In the QDS, label this as "overall R per-shell weighted" (already
      done via T03_overall_r_per_shell_weighted) and keep R-free reporting on phenix.model_vs_data
      and gemmi.
    status: mitigated
    tool_ref: Servalcat
  - id: ASSUM_servalcat_refine_xtal_actually_refines
    kind: explicit
    scope: tool
    title: refine_xtal_norefmac re-refines the model
    description: '`servalcat refine_xtal_norefmac` runs a full refinement; the resulting
      R-factor is for a NEW model, not a re-measurement of the input.'
    consequences: Comparing this R-factor to the agent's R-factor is comparing two
      different models. It is a useful "what does an independent refiner do with this
      data" check, not a re-measurement.
    mitigation: Cite both — input model R via model_vs_data, re-refined R via servalcat.
    status: mitigated
    tool_ref: Servalcat
  - id: ASSUM_molprobity_top8000_reference
    kind: implicit
    scope: tool
    title: Top8000 reference distribution is high-resolution
    description: MolProbity's percentile rankings and outlier definitions come from
      Top8000, a corpus of high-resolution (≤ 2.0 Å) deposited structures. Applying
      these to a 3.0 Å model still produces a percentile, but the threshold for "outlier"
      was set against tighter geometry than the model can deliver.
    consequences: Mid-resolution models (2.5–3.5 Å) accumulate "outliers" that are
      not actual modelling errors but resolution-driven coordinate uncertainty. The
      published rate can look worse than the model is.
    mitigation: Pair every MolProbity number with the model's resolution; cite the
      resolution-bin percentile (wwPDB validation report's column) rather than the
      all-archive percentile when comparing across datasets.
    status: unchecked
    tool_ref: MolProbity (gold)
    evidence_refs:
    - Williams2018
  - id: ASSUM_molprobity_h_atom_placement
    kind: implicit
    scope: tool
    title: H-atom placement governs clashscore
    description: '`reduce -build` chooses Asn/Gln/His flips and adds H atoms with
      default bond-length and rotamer choices. Different builds shift clashscore by
      ~0.5 — confirmed on 1SAR (mmtbx.validation_summary reports 3.13, standalone
      Richardson probe + reduce reports 3.63).'
    consequences: '"Matches MolProbity within 1.0" is a guarantee about the metric
      bucket, not the geometry of the H-built model.'
    mitigation: Quote the H-build flags actually used. Do not equate the cctbx wrapper's
      clashscore with the standalone Richardson pipeline's without saying so.
    status: mitigated
    tool_ref: MolProbity (gold)
    evidence_refs:
    - EVAL_1sar_cdba2c07_2026-04-24
  - id: ASSUM_molprobity_water_altloc
    kind: implicit
    scope: tool
    title: probe water + altloc filter (`ogt33`)
    description: '`probe`''s default selection — occupancy > 33% — determines which
      atoms are eligible to clash. Disordered residues at 30% occupancy drop out of
      the calculation entirely.'
    consequences: Clashscore can hide real geometry problems at low-occupancy altlocs
      — exactly the regions a refinement most needs scrutiny.
    mitigation: Re-run probe with `--noaltloc` or relaxed occupancy thresholds.
    status: unchecked
    tool_ref: MolProbity (gold)
  - id: ASSUM_molprobity_rotamer_library_discreteness
    kind: implicit
    scope: tool
    title: Discrete rotamer library
    description: A side-chain χ angle one degree outside the favored region scores
      as a rotamer outlier. The "% rotamer outliers" metric is sharp by construction.
    consequences: Borderline outliers are indistinguishable from severe ones in the
      headline percentage.
    mitigation: Surface the residue ids of all outliers via PerResidueQuality. outliers[]
      with the actual χ deviation as metric_value.
    status: mitigated
    tool_ref: MolProbity (gold)
  - id: ASSUM_holton_rmsz_not_rmsd
    kind: explicit
    scope: tool
    title: Reports RMSZ against PHENIX restraint targets
    description: Holton geometry validation reports σ-units against PHENIX's internal
      restraint library. RMSZ is not interchangeable with raw RMSD — a tight restraint
      library can flag small absolute RMSDs as high-Z outliers.
    consequences: '"Bond RMSD 0.008 Å" and "bond RMSZ 1.4 σ" are both fine; they are
      not the same number.'
    mitigation: Schema v3+ carries both bond_rmsd_a and bond_rmsz on GeometrySummary.
    status: mitigated
    tool_ref: phenix.holton_geometry_validation
  - id: ASSUM_find_peaks_holes_cutoff_and_merging
    kind: explicit
    scope: tool
    title: σ cutoff, merging radius, atom exclusion all change peak counts
    description: Default 4.0 σ cutoff; default peak-merging radius collapses multi-atom
      features; near-modelled-atom peaks are excluded by default. The 1SAR agent's
      report listed 9 peaks; the oracle run at 4 σ found 23 positive + 8 negative
      peaks.
    consequences: Different parameter choices = different counts. "All peaks > 4 σ
      are explained" is meaningless without naming the cutoff / merging radius / exclusion
      settings used to produce the list.
    mitigation: Always quote the cutoff and merging settings. Re-run the oracle with
      the same settings before adopting the agent's peak list.
    status: known_violation
    tool_ref: phenix.find_peaks_holes
    evidence_refs:
    - EVAL_1sar_cdba2c07_2026-04-24
  - id: ASSUM_wwpdb_percentile_source
    kind: explicit
    scope: tool
    title: Percentile rank — whole archive vs resolution-binned
    description: The wwPDB validation report computes percentile ranks both against
      the entire archive AND against a resolution-binned subset. They are different
      numbers.
    consequences: A clashscore of 8 might be 70th percentile vs all PDB but 30th percentile
      at 1.5 Å — same model, different interpretation.
    mitigation: Surface both percentile numbers when both are reported.
    status: mitigated
    tool_ref: phenix.find_peaks_holes
    notes: tool_ref points at phenix.find_peaks_holes only because LinkML requires
      a class reference; in practice this assumption applies to any percentile report.
      Use Container-level assumptions[] to attach to a non-tool host once that pattern
      is needed.
  - id: ASSUM_ost_lddt_inclusion_radius
    kind: explicit
    scope: tool
    title: lDDT inclusion radius (default 15 Å)
    description: OST's `lddt` CLI defaults to a 15 Å distance inclusion radius. Reducing
      the radius rewards local fidelity; increasing it rewards extended geometry.
      Two lDDT scores produced with different radii are not directly comparable.
    consequences: A 0.97 lDDT at 15 Å is not the same as a 0.97 lDDT at 10 Å. Cross-tool
      comparisons must use the same radius.
    mitigation: Always quote the radius in PairwiseComparison.notes when reporting
      lDDT. Default 15 Å for the project; document any deviation.
    status: mitigated
    tool_ref: OpenStructure
    evidence_refs:
    - Mariani2013
  - id: ASSUM_ost_lddt_thresholds
    kind: explicit
    scope: tool
    title: lDDT cutoff thresholds (0.5, 1, 2, 4 Å)
    description: lDDT counts a distance as "preserved" if it falls within any of four
      cutoffs (0.5 / 1 / 2 / 4 Å). The score is the unweighted mean of the four pass-fractions.
    consequences: A model can score 0.97 at 4 Å tolerance but <0.5 at the strict 0.5
      Å cutoff. The headline lDDT averages over all four; sites with sub-Å precision
      needs need the per-cutoff breakdown.
    mitigation: OST emits per-cutoff fractions if requested; surface them when the
      structure claims sub-Å accuracy.
    status: unchecked
    tool_ref: OpenStructure
    evidence_refs:
    - Mariani2013
  - id: ASSUM_ost_lddt_cα_only_mode
    kind: explicit
    scope: tool
    title: -c flag computes Cα-only lDDT
    description: Running `lddt -c` restricts the calculation to Cα atoms (faster,
      backbone-only). Without -c the full all-atom lDDT is computed. The -c variant
      is what AlphaFold's pLDDT predicts.
    consequences: lDDT-Cα is more permissive than all-atom lDDT (it ignores side-chain
      placement quality entirely).
    mitigation: 'State which mode was used. For the project: -c is acceptable when
      the structure is at moderate resolution (≥ 2.5 Å) where side-chain placement
      is itself uncertain.'
    status: mitigated
    tool_ref: OpenStructure
    evidence_refs:
    - EVAL_1sar_cdba2c07_2026-04-24
  - id: ASSUM_ost_no_built_in_rama_contour
    kind: implicit
    scope: tool
    title: No built-in Top8000 Ramachandran contour
    description: OST exposes φ/ψ extraction via residue.GetPhiTorsion() / GetPsiTorsion()
      but does not ship Top8000 contour data for Ramachandran outlier classification.
      Outlier classification via OST requires either external contour data files or
      a custom coarse classifier (which mis-fires on the boundary).
    consequences: OST is not a drop-in replacement for MolProbity's Rama outlier analysis.
      It IS a drop-in replacement for lDDT, structural comparison, and Cα displacement
      analysis.
    mitigation: Do not use OST for headline Rama outlier % numbers. Use it as a φ/ψ
      extractor where needed; defer outlier classification to MolProbity or a future
      OST plugin that ships contour data.
    status: known_violation
    tool_ref: OpenStructure
  - id: ASSUM_refmac_restraint_library
    kind: explicit
    scope: tool
    title: REFMAC5 uses the CCP4 monomer library
    description: REFMAC5 reports geometry RMSZ against the CCP4 restraint dictionary,
      which is an independent code path from PHENIX's restraint library (mon_lib).
    consequences: RMSZ from REFMAC and RMSZ from phenix.holton_geometry_validation
      can disagree on the same atoms because the σ targets differ — typically by 0.1-0.3
      σ, occasionally more for unusual residues.
    mitigation: State which library was used. Cross-tool RMSZ agreement within ~0.5
      σ counts as confirmed; larger disagreement flags either a modelling issue or
      a restraint-library mismatch.
    status: mitigated
    tool_ref: REFMAC5
  - id: ASSUM_refmac_solvent_modelling
    kind: explicit
    scope: tool
    title: REFMAC5 uses Babinet-style bulk solvent
    description: REFMAC5's bulk-solvent model differs from PHENIX's. R-factors from
      a REFMAC re-refinement are not directly comparable to PHENIX in-run values;
      expect differences in the 0.005-0.015 range on the same data.
    consequences: A REFMAC re-refinement of the agent's model giving 0.158 R-free
      vs phenix.refine 0.149 is not necessarily a "regression" — it's a different
      scaling.
    mitigation: When using REFMAC as a second-opinion refiner, compare on the same
      scale (REFMAC vs REFMAC, PHENIX vs PHENIX) for cross-round Δ-claims; cross-tool
      comparison is for "are we in the same bracket".
    status: mitigated
    tool_ref: REFMAC5
  - id: ASSUM_prosmart_reference_dependent
    kind: explicit
    scope: tool
    title: ProSMART analysis is reference-dependent
    description: ProSMART computes per-residue scores AGAINST a reference structure
      (typically the deposited model or a high-resolution comparator). Choosing a
      different reference changes every score. There is no "absolute" ProSMART number
      for a structure.
    consequences: A ProSMART Rama-Z of 1.2 vs reference X is not the same number as
      1.2 vs reference Y. Reports must always quote the reference.
    mitigation: Pin the reference per evaluation. For agentic refinement vs starting
      model, use the agent's input model as the reference. For absolute geometry analysis,
      use Top8000 (when available via ProSMART's data files) or compare to a high-resolution
      family member.
    status: mitigated
    tool_ref: ProSMART
  - id: ASSUM_prosmart_no_top8000_default
    kind: implicit
    scope: tool
    title: ProSMART needs an explicit reference; no Top8000 default
    description: Unlike MolProbity (which has Top8000 baked in), ProSMART's Rama-Z
      analysis requires the user to supply a reference. The tool ships with template-based
      options but no single default.
    consequences: Running ProSMART without specifying a reference gives a meaningless
      score; misconfigured runs can pass silently.
    mitigation: Always specify the reference structure on the command line.
    status: unchecked
    tool_ref: ProSMART
  - id: ASSUM_checkmymetal_geometry_based
    kind: explicit
    scope: tool
    title: Heuristic geometry classification — not anomalous Fourier
    description: 'CheckMyMetal classifies modelled metal-ion identity by comparing
      observed coordination geometry (number of contacts, bond lengths, angles, B-factor)
      against canonical expectations per element. Returns a verdict: "modelled element
      OK" / "alternative element X fits better" / "uninterpretable". Fast, free, web-only,
      no install — uses no anomalous data.'
    consequences: A geometry-based check can be fooled when two elements have similar
      coordination geometry (Ca²⁺ vs Mg²⁺ at moderate resolution; Na⁺ vs K⁺). Strongest
      when the geometry is clearly wrong for the modelled element.
    mitigation: Treat as one of several lines of evidence. Downgrade verdict to "consistent
      with X — alternatives possible at this resolution" when CheckMyMetal returns
      ambiguous, especially when no anomalous data exist.
    status: unchecked
    tool_ref: CheckMyMetal
    notes: 'Web service: <https://checkmymetal.research.uchicago.edu/>. Submission
      is a coordinates+MTZ file pair; result is HTML/JSON. Useful when 1sar.mtz-style
      datasets (no anomalous columns) leave element identity otherwise uncheckable.'
  - id: ASSUM_EVAL_1sar_cdba2c07_2026-04-24_displacement_single_tool_only
    kind: implicit
    scope: measurement
    title: Per-residue displacement is single-tool (gemmi only)
    description: The per-residue Cα displacement array was computed via gemmi only.
      The cross-tool trust model requires ≥ 1 confirmation from a different code base.
    consequences: The 0.955 Å max displacement at A:34 is consistent with the agent's
      claim, but not independently confirmed.
    mitigation: Cross-check with phenix.superpose_models per-residue mode.
    status: unchecked
  - id: ASSUM_EVAL_1sar_cdba2c07_2026-04-24_ligand_no_anomalous_columns_in_mtz
    kind: explicit
    scope: measurement
    title: No anomalous columns in 1sar.mtz — element identity unchecked
    description: phenix.mtz.dump shows only F-obs / SIGF-obs / R-free-flags columns.
      No anomalous-difference signal is available to distinguish Ca²⁺ from Mg²⁺.
    consequences: Element-identity claim cannot be cross-checked against anomalous
      data.
    mitigation: If the deposition has anomalous data on file, request and verify.
      Otherwise mark verdict as 'consistent with' rather than 'is'.
    status: known_violation
  - id: ASSUM_EVAL_1sar_cdba2c07_2026-04-24_peaks_classification_interpretive
    kind: implicit
    scope: interpretation
    title: Peak classifications are interpretive labels, not measurements
    description: The agent's labels — 'water adjustment', 'side-chain flex', 'possible
      unmodelled water' — were not verified by independent oracle work.
    consequences: The "all peaks > 4 σ are explained" success criterion rests on the
      agent's own narrative, not on oracle agreement.
    mitigation: Re-run peak finder with consistent settings; flag peaks > 5 σ.
    status: known_violation
  - id: EVAL_1sar_cdba2c07_2026-04-24_assum_prosmart_reference_dependent_for_asn39
    kind: explicit
    scope: measurement
    title: ProSMART score is relative to the deposited starting model
    description: This measurement compared 1sar_final.pdb to the deposited 1sar.pdb.
      The Procrustes score is a relative measure of local-fragment geometric divergence
      from that specific reference.
    consequences: If we used a different reference (e.g. an ultra-high-res SNase structure),
      the score would change. The score indicates Asn A 39 moved most relative to
      the starting model — consistent with the Cα displacement / lDDT findings — and
      is a Ramachandran outlier flag at the same residue under MolProbity.
    mitigation: Reference is pinned and named in scope_selector.
    status: mitigated
    tool_ref: ProSMART
  - id: ASSUM_EVAL_1sar_cdba2c07_2026-04-24_report_r_from_refine_log
    kind: implicit
    scope: report
    title: R-factors read from phenix.refine in-run log
    description: The agent's reported R-work / R-free for the final model come from
      phenix.refine's in-run statistics, not from a fresh re-derivation by phenix.model_vs_data.
    consequences: On the 1SAR final model the gap is 0.149 / 0.199 (agent) vs 0.156
      / 0.212 (model_vs_data) — exactly enough for the round-7 R-free-gap claim to
      straddle the < 0.05 success criterion.
    mitigation: Always re-derive R-factors with phenix.model_vs_data and report that
      as the QDS value of record.
    status: known_violation
    evidence_refs:
    - EVAL_1sar_cdba2c07_2026-04-24
  - id: ASSUM_EVAL_1sar_cdba2c07_2026-04-24_report_round_table_collapses_rounds
    kind: implicit
    scope: report
    title: Per-round table collapses rounds 5-6
    description: The agent's narrative reports "Round 5-6" as a single row even though
      the artefact contains separate round-5 and round-6 PDB+MTZ pairs.
    consequences: Round 6 oracle R-free (0.207) is BETTER than round 7 (0.212) — an
      effect the collapsed reporting hides. Round 7's NCS torsion restraints did not
      improve the cross-validated R.
    mitigation: Run phenix.model_vs_data on every round individually; surface a Refinement
      record per round.
    status: known_violation
    evidence_refs:
    - EVAL_1sar_cdba2c07_2026-04-24
  - id: ASSUM_EVAL_1sar_cdba2c07_2026-04-24_report_position_initial_not_final
    kind: implicit
    scope: report
    title: Quoted ion position is initial placement, not final
    description: The agent's report quotes Ca²⁺ at (66.611, 3.895, 13.404). The actual
      final-model PDB has Ca²⁺ at (66.752, 3.733, 13.397) — 0.215 Å away.
    consequences: Anyone citing the report's coordinates will be 0.2 Å off from the
      deposited model. The narrative also refers to a 0.19 Å coordinate shift — the
      position-of-record is the *initial* placement before refinement moved it.
    mitigation: Verify every quoted coordinate against the deposited PDB to within
      ≤ 0.05 Å. Treat a > 0.05 Å gap as a flag, not a rounding artefact.
    status: known_violation
    evidence_refs:
    - EVAL_1sar_cdba2c07_2026-04-24
  - id: ASSUM_EVAL_1sar_cdba2c07_2026-04-24_report_water_count_stage_drift
    kind: implicit
    scope: report
    title: Water count from a different stage than the deposited PDB
    description: Agent reports 159 ordered waters; the deposited 1sar_final.pdb has
      146. The 13-water gap matches the 1654 vs 1641 total-atom gap exactly.
    consequences: Atom-count and water-count narrative numbers are taken from a pre-pruning
      step; the deposited model is post-pruning. Anyone reproducing the count from
      the PDB will be off by 13.
    mitigation: Always count waters from the actual deposited PDB.
    status: known_violation
    evidence_refs:
    - EVAL_1sar_cdba2c07_2026-04-24
  - id: ASSUM_EVAL_1sar_cdba2c07_2026-04-24_report_mean_b_subset_drift
    kind: implicit
    scope: report
    title: Mean B-factor uses a different atom subset than the oracle
    description: Agent quotes ⟨B⟩ = 14.6 Å²; gemmi-based oracle on heavy atoms gives
      ⟨B⟩ = 15.98 Å². Δ = 1.4 Å² exceeds the published wwPDB B-factor uncertainty
      bracket (~6-9 Å² spread is normal but the mean should agree).
    consequences: Suggests the agent's mean was computed over a different atom subset
      (possibly excluding solvent, possibly using the residue-mean rather than atom-mean).
    mitigation: State which atom subset the mean is computed over (heavy-only vs all,
      with-or-without solvent, with-or-without ions).
    status: known_violation
    evidence_refs:
    - EVAL_1sar_cdba2c07_2026-04-24
  - id: ASSUM_EVAL_1sar_cdba2c07_2026-04-24_interp_ion_identity_no_anomalous
    kind: implicit
    scope: interpretation
    title: Ion identity inferred from peak height alone
    description: The "6.5 σ peak near Asp33 = Ca²⁺" identification is asserted from
      the difference map alone. No anomalous-difference Fourier was computed; Mg²⁺,
      Mn²⁺, and Na⁺ were not excluded by occupancy refinement; no alternative-element
      refinement was tried.
    consequences: Mg²⁺ would give very similar geometry. The structural conclusion
      "this is Ca²⁺" is consistent with the data but not uniquely so.
    mitigation: Check whether anomalous data is available; if not, downgrade the verdict
      to "consistent with Ca²⁺ — alternatives not excluded". Run alternative-element
      occupancy refinement.
    status: known_violation
    evidence_refs:
    - EVAL_1sar_cdba2c07_2026-04-24
    notes: 1sar.mtz has only F-obs / SIGF-obs / R-free-flags columns — no anomalous
      columns. The single-wavelength data cannot distinguish Ca²⁺ from Mg²⁺ on element
      identity alone.
  - id: ASSUM_EVAL_1sar_cdba2c07_2026-04-24_interp_density_peak_narratives
    kind: implicit
    scope: interpretation
    title: Density-peak classifications are interpretive, not measured
    description: Each peak in the agent's table is labelled "water adjustment" / "side-chain
      flexibility" / "possible unmodelled water" / etc. None of these classifications
      were verified by independent oracle work (no alt-conf refinement, no anomalous
      Fourier, no occupancy refinement).
    consequences: The "all peaks > 4 σ are explained" claim is the agent's annotation,
      not an oracle-verifiable finding.
    mitigation: Re-run phenix.find_peaks_holes with consistent settings and compare
      the peak inventory directly. Flag peaks > 5 σ that the agent did not surface
      (5 such peaks on 1SAR).
    status: known_violation
    evidence_refs:
    - EVAL_1sar_cdba2c07_2026-04-24
  - id: ASSUM_EVAL_1sar_cdba2c07_2026-04-24_interp_ncs_effective_ratio_heuristic
    kind: implicit
    scope: interpretation
    title: NCS effective data-to-parameter ratio is a heuristic
    description: The "846 NCS torsion restraints effectively double the data" claim
      (0.98 → 1.79) treats the restraints as fully saturated and uncorrelated with
      model coordinates. The actual contribution depends on restraint weight and geometry
      coupling and is not a measured quantity.
    consequences: Cannot be cross-checked with an oracle; it's a model-assumption
      number.
    mitigation: Report it as agent-claim only; do not include in the cross-tool verdict.
      If verification is needed, refine without NCS and compare R-free directly.
    status: unchecked
  - id: ASSUM_EVAL_1sar_cdba2c07_2026-04-24_interp_baseline_is_deposited_model
    kind: implicit
    scope: interpretation
    title: Pre-refinement baseline is the deposited model
    description: Δ start → final framing implicitly equates "the deposited 1SAR" with
      an unrefined starting model. The deposited model is itself a refined product.
    consequences: ΔR-free 0.184 measures improvement over the deposition, not over
      a truly unrefined model.
    mitigation: When evaluating agentic refinement on deposited targets, treat the
      deposition as the floor, not the worst-case baseline.
    status: mitigated
  - id: ASSUM_EVAL_1sar_cdba2c07_2026-04-24_interp_cooperative_binding_literature
    kind: implicit
    scope: interpretation
    title: Cooperative binding rationale is literature interpretation
    description: The "weaker Ca²⁺ binding without nucleotide" structural-biology argument
      is a hypothesis from the literature, not a measurement made by any oracle in
      the catalog.
    consequences: Should not appear in the QDS verdict as a quality finding.
    mitigation: Treat such reasoning as inference, kept separate from oracle measurements.
    status: mitigated
  - id: ASSUM_EVAL_1sar_cdba2c07_2026-04-24_interp_round7_ncs_improvement_claim
    kind: explicit
    scope: interpretation
    title: Round-7 NCS-restraint improvement claim does not hold by oracle
    description: 'Agent: "Round 7 reduced the gap from 0.053 to 0.050 by adding NCS
      torsion restraints." Oracle: round 6 gap was 0.053, round 7 gap is 0.055 — the
      gap went UP.'
    consequences: An effect the agent reports as the headline outcome of round 7 (meeting
      < 0.05 by adding NCS) is not visible in the cross-validated data.
    mitigation: Verify any "X improved Y by Z" claim with the oracle re-measurement
      of X-without and X-with.
    status: known_violation
    evidence_refs:
    - EVAL_1sar_cdba2c07_2026-04-24
  - id: ASSUM_EVAL_1sar_cdba2c07_2026-04-24_agg_single_model_verdict
    kind: implicit
    scope: aggregation
    title: Single-model verdicts treat the final PDB as a point estimate
    description: No B-factor uncertainty propagation, no rotamer alternate-conformation
      enumeration, no map-error envelope. Numbers are quoted as scalars.
    consequences: An R-free of 0.199 ± 0.005 (uncertainty propagated from data-quality
      and model-error sources) reads the same as a noiseless 0.199. The 0.013 R-unit
      gap to phenix.model_vs_data sits within plausible uncertainty but the agent's
      report does not surface that bracket.
    mitigation: Populate TypedMeasurementValue.mean / std_dev / min_value / max_value
      / count for any measurement that summarises an array. Schema v3+ supports this.
    status: mitigated
  - id: ASSUM_EVAL_1sar_cdba2c07_2026-04-24_agg_zero_rama_rounds_one_outlier_to_zero
    kind: implicit
    scope: aggregation
    title: '"0.00% Ramachandran outliers" rounds 1 outlier to zero'
    description: Agent's round-7 row reports 0.00% Rama outliers; both PHENIX tools
      actually flag 1 residue (Asn A 39) → 0.53%.
    consequences: A claim of "all outliers eliminated" reads as headline-true while
      an outlier remains in a functional region.
    mitigation: Surface every outlier residue id via PerResidueQuality.outliers[]
      even when the rate rounds to 0%.
    status: mitigated
    evidence_refs:
    - EVAL_1sar_cdba2c07_2026-04-24
  - id: ASSUM_EVAL_1sar_cdba2c07_2026-04-24_agg_single_tool_geometry_validation
    kind: explicit
    scope: aggregation
    title: Single-tool geometry validation (cctbx-only via phenix.molprobity)
    description: The agent's geometry numbers come from `phenix.molprobity` — the
      cctbx wrapper. Same code base as the refiner that minimised those restraints.
    consequences: Does not satisfy the cross-tool trust model on its own.
    mitigation: Run probe + reduce (Richardson lab standalone) alongside; surface
      both with oracle_family annotations. Already done for clashscore on 1SAR; extend
      to Ramachandran / rotamer.
    status: mitigated
    evidence_refs:
    - EVAL_1sar_cdba2c07_2026-04-24
