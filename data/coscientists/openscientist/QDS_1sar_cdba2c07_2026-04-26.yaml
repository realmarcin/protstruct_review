  - id: REC_T01_ca_rmsd_top_considered
    metric_definition_ref: T01_ca_rmsd_å
    tool_ref: TM-align
    role: top_considered
    rank: 1
    justification: Sequence-independent superposition; CASP/community gold-standard
      for pair-of-structures RMSD when alignment quality matters.
