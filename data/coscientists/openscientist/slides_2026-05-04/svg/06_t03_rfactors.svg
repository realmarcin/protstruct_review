  <rect x="80" y="540" width="880" height="200" rx="10" fill="#f5d6d4" stroke="#a8201a" stroke-width="2"/>
  <text x="100" y="585" font-size="24" font-weight="700" fill="#a8201a">R-free under-statement is reproducible</text>
  <text x="100" y="625" font-size="18" fill="#1a1a2e">Three independent code paths converge on R-free ≈ 0.21.</text>
  <text x="100" y="655" font-size="18" fill="#1a1a2e">Likely cause: <tspan font-weight="700">phenix.refine in-run scaling vs catalog-oracle scaling</tspan>.</text>
  <text x="100" y="685" font-size="18" fill="#1a1a2e">Mitigation: report from phenix.model_vs_data, not from refine’s log.</text>
  <text x="100" y="720" font-size="16" fill="#5a6071">ASSUM_phenix_refine_in_run_r_factors_use_internal_scaling — known_violation hardened.</text>
  <rect x="980" y="540" width="860" height="200" rx="10" fill="#fbeecb" stroke="#b07c00" stroke-width="2"/>
  <text x="1000" y="585" font-size="24" font-weight="700" fill="#b07c00">R-free gap criterion is scaling-dependent</text>
  <text x="1000" y="625" font-size="18" fill="#1a1a2e">PHENIX gap 0.055 (✗) · gemmi 0.053 (✗) · REFMAC5 0.044 (✓)</text>
  <text x="1000" y="660" font-size="18" fill="#1a1a2e">Catalog oracle of record = phenix.model_vs_data → fails &lt; 0.05.</text>
  <text x="1000" y="700" font-size="18" fill="#1a1a2e">Reportable as a <tspan font-weight="700">scaling-sensitive failure</tspan>, not a raw R-free defect.</text>
