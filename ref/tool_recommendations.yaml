# Tool recommendations per metric — protstruct_review v0.1
#
# Two roles per (metric, tool) pair:
#   top_considered  — community / literature consensus on the canonical tool
#   top_performing  — empirically best in this harness (often the same tool)
#
# When the two roles differ, both rows exist. Downstream tooling can compare
# the recommendation against MeasurementValue.oracle_tool_ref to flag evals
# that used a non-recommended tool.
#
# Recommendations evolve. Bump `as_of_date` when a recommendation changes;
# don't mutate in place. The QualityDataSheet snapshots the recommendations
# active at its `issued_at` via `tool_recommendations_applied`.
#
# Schema: schemas/protstruct_review.yaml — class ToolRecommendation.

tool_recommendations:

  # ----- T01: Structure superposition + RMSD -----------------------------

  - id: REC_T01_ca_rmsd_top_considered
    metric_definition_ref: T01_ca_rmsd_å
    tool_ref: TM-align
    role: top_considered
    rank: 1
    justification: >-
      Sequence-independent superposition; CASP/community gold-standard for
      pair-of-structures RMSD when alignment quality matters.
    evidence_refs:
      - Zhang2004
    as_of_date: '2026-04-25'

  - id: REC_T01_ca_rmsd_top_performing
    metric_definition_ref: T01_ca_rmsd_å
    tool_ref: TM-align
    role: top_performing
    rank: 1
    justification: >-
      Matched phenix.superpose_models within 0.03 Å on the 1SAR eval
      (TM-align 0.41 Å vs PHENIX 0.43 Å vs agent-reported 0.438 Å).
    evidence_refs:
      - EVAL_1sar_cdba2c07_2026-04-24
    as_of_date: '2026-04-25'

  - id: REC_T01_ca_rmsd_alternative
    metric_definition_ref: T01_ca_rmsd_å
    tool_ref: gemmi align
    role: alternative
    rank: 2
    justification: >-
      Lightweight, scriptable second oracle. Use when TM-align is
      unavailable or when a non-Zhang-lab implementation is needed.
    as_of_date: '2026-04-25'

  - id: REC_T01_tm_score_top_considered
    metric_definition_ref: T01_tm-score
    tool_ref: TM-align
    role: top_considered
    rank: 1
    justification: >-
      TM-score is the metric and TM-align is its reference implementation.
    evidence_refs:
      - Zhang2004
    as_of_date: '2026-04-25'

  # ----- T03: Reciprocal-space refinement (X-ray) ------------------------
  # The catalog T06 oracle (phenix.model_vs_data) is what produces R-factors
  # post-refinement; the canonical T03 second-opinion oracle is REFMAC5
  # (CCP4) but it isn't installed locally — Servalcat sigmaa is the
  # closest non-cctbx alternative we have.

  - id: REC_T03_r_work_top_considered
    metric_definition_ref: T03_r-work
    tool_ref: phenix.model_vs_data
    role: top_considered
    rank: 1
    justification: >-
      Catalog-defined T06 oracle; re-derives R-factors from PDB+MTZ with
      its own scaling, rather than reading them from a refinement log.
    evidence_refs:
      - Brünger1992
      - EvansMurshudov2013
    as_of_date: '2026-04-25'

  - id: REC_T03_r_work_top_performing
    metric_definition_ref: T03_r-work
    tool_ref: gemmi sfcalc
    role: top_performing
    rank: 1
    justification: >-
      Non-cctbx independent oracle; corroborated phenix.model_vs_data on
      the 1SAR eval (0.164 vs 0.156, both above the agent-reported 0.149)
      and is what hardened the "agent's R-free is too low" finding.
    evidence_refs:
      - EVAL_1sar_cdba2c07_2026-04-24
    as_of_date: '2026-04-25'

  - id: REC_T03_r_work_alternative_servalcat
    metric_definition_ref: T03_r-work
    tool_ref: Servalcat
    role: alternative
    rank: 2
    justification: >-
      Murshudov-group implementation; per-shell R via `servalcat sigmaa`.
      Independent code base; preferred when REFMAC5 is unavailable.
    evidence_refs:
      - Yamashita2021
    as_of_date: '2026-04-25'

  - id: REC_T03_r_free_top_considered
    metric_definition_ref: T03_r-free
    tool_ref: phenix.model_vs_data
    role: top_considered
    rank: 1
    justification: Same as R-work — re-derives from data; never read from refinement log alone.
    evidence_refs:
      - Brünger1992
    as_of_date: '2026-04-25'

  - id: REC_T03_r_free_top_performing
    metric_definition_ref: T03_r-free
    tool_ref: gemmi sfcalc
    role: top_performing
    rank: 1
    justification: Non-cctbx confirmation of R-free finding on 1SAR eval.
    evidence_refs:
      - EVAL_1sar_cdba2c07_2026-04-24
    as_of_date: '2026-04-25'

  - id: REC_T03_gap_top_considered
    metric_definition_ref: T03_r-free_r-work_gap
    tool_ref: phenix.model_vs_data
    role: top_considered
    rank: 1
    justification: >-
      The gap is computed from the same R-work / R-free pair, so the
      strongest tool for those is also the strongest for the gap.
    as_of_date: '2026-04-25'

  # ----- T05: Geometry validation ---------------------------------------
  # The catalog gold-standard oracle for T05 is standalone MolProbity,
  # i.e., the Richardson lab probe + reduce binaries (NOT the PHENIX
  # `phenix.molprobity` wrapper). The PHENIX wrapper is acceptable as
  # an alternative — see notes.

  - id: REC_T05_clashscore_top_considered
    metric_definition_ref: T05_clashscore
    tool_ref: MolProbity (gold)
    role: top_considered
    rank: 1
    justification: >-
      Standalone Richardson-lab pipeline (probe + reduce) is the catalog
      gold standard. Same code that powers the wwPDB validation report.
    evidence_refs:
      - Davis2007
      - Williams2018
    as_of_date: '2026-04-25'

  - id: REC_T05_clashscore_top_performing
    metric_definition_ref: T05_clashscore
    tool_ref: MolProbity (gold)
    role: top_performing
    rank: 1
    justification: >-
      11 unique clashes / 3027 atoms = 3.63 on 1SAR eval, in line with
      mmtbx.validation_summary's 3.13 (Δ = 0.5, within MolProbity method
      noise — different H-build / water handling).
    evidence_refs:
      - EVAL_1sar_cdba2c07_2026-04-24
    as_of_date: '2026-04-25'

  - id: REC_T05_clashscore_alternative_phenix
    metric_definition_ref: T05_clashscore
    tool_ref: mmtbx.validation_summary
    role: alternative
    rank: 2
    justification: >-
      cctbx wrapper. Acceptable as a second opinion but does not satisfy
      the trust model on its own (PHENIX-grading-PHENIX). Use with the
      Richardson-lab standalone pipeline alongside.
    as_of_date: '2026-04-25'

  - id: REC_T05_rama_outlier_top_considered
    metric_definition_ref: T05_ramachandran_outlier
    tool_ref: MolProbity (gold)
    role: top_considered
    rank: 1
    justification: >-
      MolProbity Top8000 reference dataset is the field standard for
      Ramachandran percentile classification.
    evidence_refs:
      - Williams2018
    as_of_date: '2026-04-25'

  - id: REC_T05_rama_favored_top_considered
    metric_definition_ref: T05_ramachandran_favored
    tool_ref: MolProbity (gold)
    role: top_considered
    rank: 1
    justification: Same as Rama outlier — Top8000 reference.
    evidence_refs:
      - Williams2018
    as_of_date: '2026-04-25'

  - id: REC_T05_rotamer_outlier_top_considered
    metric_definition_ref: T05_rotamer_outlier
    tool_ref: MolProbity (gold)
    role: top_considered
    rank: 1
    justification: >-
      Top8000 rotamer library; canonical rotamer outlier classification.
      Resolution-sensitive — flag rotamer outlier counts at > 3 Å with
      caution.
    evidence_refs:
      - Williams2018
    as_of_date: '2026-04-25'

  - id: REC_T05_molprobity_score_top_considered
    metric_definition_ref: T05_molprobity_composite
    tool_ref: MolProbity (gold)
    role: top_considered
    rank: 1
    justification: >-
      The MolProbity composite is calibrated by the same code base; only
      the Richardson-lab implementation is canonical.
    evidence_refs:
      - Davis2007
    as_of_date: '2026-04-25'

  # ----- T06: Model-vs-data statistics ----------------------------------

  - id: REC_T06_r_work_top_considered
    metric_definition_ref: T06_r-work
    tool_ref: phenix.model_vs_data
    role: top_considered
    rank: 1
    justification: Catalog-defined oracle for T06.
    as_of_date: '2026-04-25'

  - id: REC_T06_r_free_top_considered
    metric_definition_ref: T06_r-free
    tool_ref: phenix.model_vs_data
    role: top_considered
    rank: 1
    justification: Catalog-defined oracle for T06.
    as_of_date: '2026-04-25'

  - id: REC_T06_d_fsc_model_top_considered
    metric_definition_ref: T06_d_fsc_model
    tool_ref: Servalcat
    role: top_considered
    rank: 1
    justification: >-
      Non-cctbx model-map FSC implementation by the Murshudov group.
      RELION postprocess is also acceptable but is a heavier install.
    evidence_refs:
      - Yamashita2021
      - Brink2021
    as_of_date: '2026-04-25'

  # ----- Per-residue / per-site / per-ligand metrics (v2 schema) ---------

  - id: REC_T05_clashes_unique_pairs_top_considered
    metric_definition_ref: T05_clashes_unique_pairs
    tool_ref: MolProbity (gold)
    role: top_considered
    rank: 1
    justification: >-
      Probe + reduce list every clashing atom pair. The unique-pair
      count is the load-bearing intermediate in the clashscore formula
      and also the input for residue-level outlier reports.
    evidence_refs:
      - Davis2007
      - Williams2018
    as_of_date: '2026-04-26'

  - id: REC_T05_holton_geom_energy_top_considered
    metric_definition_ref: T05_holton_geom_energy_ratio_sigma
    tool_ref: phenix.holton_geometry_validation
    role: top_considered
    rank: 1
    justification: >-
      The metric is intrinsic to phenix.holton_geometry_validation;
      no external implementation exists. Cross-check the inputs
      (clashscore, Ramachandran, rotamer) against MolProbity standalone.
    as_of_date: '2026-04-26'

  - id: REC_T13_completeness_overall_top_considered
    metric_definition_ref: T13_completeness_overall_outer
    tool_ref: phenix.xtriage
    role: top_considered
    rank: 1
    justification: >-
      Catalog T13 oracle. Cross-check with CCP4 aimless when CCP4 is
      installed.
    evidence_refs:
      - EvansMurshudov2013
    as_of_date: '2026-04-26'

  # ----- Geometry RMSZ (over-refinement detector) ----------------------

  - id: REC_T05_bond_length_rmsz_top_considered
    metric_definition_ref: T05_bond-length_rmsz
    tool_ref: phenix.holton_geometry_validation
    role: top_considered
    rank: 1
    justification: >-
      Holton geometry validation reports per-class Z-scores. CCP4
      REFMAC also reports geometry RMSZ; until REFMAC is installed,
      Holton is the available oracle.
    as_of_date: '2026-04-26'

  - id: REC_T05_bond_angle_rmsz_top_considered
    metric_definition_ref: T05_bond-angle_rmsz
    tool_ref: phenix.holton_geometry_validation
    role: top_considered
    rank: 1
    justification: Same as bond-length RMSZ.
    as_of_date: '2026-04-26'

  # ----- Cryo-EM map quality additions ---------------------------------

  - id: REC_T12_cc_box_top_considered
    metric_definition_ref: T12_cc_box
    tool_ref: phenix.map_correlations
    role: top_considered
    rank: 1
    justification: >-
      Catalog cryo-EM CC family. Servalcat is acceptable as a
      non-cctbx alternative.
    evidence_refs:
      - Afonine2018
    as_of_date: '2026-04-26'

  - id: REC_T12_cc_volume_top_considered
    metric_definition_ref: T12_cc_volume
    tool_ref: phenix.map_correlations
    role: top_considered
    rank: 1
    justification: Same as CC_box. Cross-check with Servalcat fsc.
    evidence_refs:
      - Afonine2018
    as_of_date: '2026-04-26'

  - id: REC_T12_emringer_top_considered
    metric_definition_ref: T12_emringer
    tool_ref: phenix.emringer
    role: top_considered
    rank: 1
    justification: >-
      Reference implementation of EMRinger; reports side-chain–density
      agreement (Barad et al. 2015). Resolution-sensitive; informative
      above ~3 Å.
    evidence_refs:
      - Barad2015
    as_of_date: '2026-04-26'

  - id: REC_T12_q_score_top_considered
    metric_definition_ref: T12_q_score
    tool_ref: ChimeraX matchmaker
    role: top_considered
    rank: 1
    justification: >-
      MapQ ChimeraX plugin computes per-atom Q-scores (Pintilie 2020).
      Robust to over-sharpening; complementary to CC.
    evidence_refs:
      - Pintilie2020
    as_of_date: '2026-04-26'

  - id: REC_T12_global_fsc_top_considered
    metric_definition_ref: T12_global_fsc_0143
    tool_ref: Servalcat
    role: top_considered
    rank: 1
    justification: >-
      Non-cctbx FSC implementation by the Murshudov group. RELION
      postprocess is also acceptable when available.
    evidence_refs:
      - Yamashita2021
      - Brink2021
    as_of_date: '2026-04-26'

  # ----- OpenStructure (closes the cctbx-only gap on lDDT) ------------

  - id: REC_T01_lddt_global_top_considered
    metric_definition_ref: T01_lddt_global
    tool_ref: OpenStructure
    role: top_considered
    rank: 1
    justification: >-
      Reference implementation of lDDT (CASP15+ primary similarity
      metric, Mariani et al. 2013). Pure C++/Python; independent of
      cctbx. Produces global + per-residue scores in one CLI call.
    evidence_refs:
      - Mariani2013
    as_of_date: '2026-04-30'

  - id: REC_T01_lddt_global_top_performing
    metric_definition_ref: T01_lddt_global
    tool_ref: OpenStructure
    role: top_performing
    rank: 1
    justification: >-
      Independently confirmed start→final lDDT 0.9725 on 1SAR
      (preserves 97.25% of local distances). Also flagged Gly A 34
      as the lowest-lDDT residue (0.878), corroborating the gemmi
      finding that Gly A 34 has the highest Cα displacement.
    evidence_refs:
      - EVAL_1sar_cdba2c07_2026-04-24
    as_of_date: '2026-04-30'

  - id: REC_T01_per_residue_lddt_top_considered
    metric_definition_ref: T01_per_residue_lddt
    tool_ref: OpenStructure
    role: top_considered
    rank: 1
    justification: >-
      OST `lddt` CLI emits per-residue lDDT in one invocation. Closes
      the per-residue lDDT cctbx-only gap.
    evidence_refs:
      - Mariani2013
    as_of_date: '2026-04-30'
