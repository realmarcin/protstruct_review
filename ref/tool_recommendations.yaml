    as_of_date: '2026-04-26'

  - id: REC_T12_global_fsc_top_considered
    metric_definition_ref: T12_global_fsc_0143
    tool_ref: Servalcat
    role: top_considered
    rank: 1
    justification: >-
      Non-cctbx FSC implementation by the Murshudov group. RELION
      postprocess is also acceptable when available.
    evidence_refs:
      - Yamashita2021
      - Brink2021
    as_of_date: '2026-04-26'

  # ----- OpenStructure (closes the cctbx-only gap on lDDT) ------------

  - id: REC_T01_lddt_global_top_considered
    metric_definition_ref: T01_lddt_global
    tool_ref: OpenStructure
    role: top_considered
    rank: 1
    justification: >-
      Reference implementation of lDDT (CASP15+ primary similarity
      metric, Mariani et al. 2013). Pure C++/Python; independent of
      cctbx. Produces global + per-residue scores in one CLI call.
    evidence_refs:
      - Mariani2013
    as_of_date: '2026-04-30'

  - id: REC_T01_lddt_global_top_performing
    metric_definition_ref: T01_lddt_global
    tool_ref: OpenStructure
    role: top_performing
    rank: 1
    justification: >-
      Independently confirmed start→final lDDT 0.9725 on 1SAR
      (preserves 97.25% of local distances). Also flagged Gly A 34
      as the lowest-lDDT residue (0.878), corroborating the gemmi
      finding that Gly A 34 has the highest Cα displacement.
    evidence_refs:
      - EVAL_1sar_cdba2c07_2026-04-24
    as_of_date: '2026-04-30'

  - id: REC_T01_per_residue_lddt_top_considered
    metric_definition_ref: T01_per_residue_lddt
    tool_ref: OpenStructure
    role: top_considered
    rank: 1
    justification: >-
      OST `lddt` CLI emits per-residue lDDT in one invocation. Closes
      the per-residue lDDT cctbx-only gap.
    evidence_refs:
      - Mariani2013
    as_of_date: '2026-04-30'

  # ----- CCP4 / REFMAC5 / ProSMART (closes cctbx-only gap on
  # ----- Ramachandran outliers, rotamer outliers, MolProbity composite,
  # ----- and adds T03 refinement second-opinion).

  - id: REC_T05_ramachandran_outlier_top_performing
    metric_definition_ref: T05_ramachandran_outlier
    tool_ref: ProSMART
    role: top_performing
    rank: 1
    justification: >-
      ProSMART is non-cctbx (CCP4 stack, Murshudov-group code path).
      It provides per-residue Ramachandran-Z scores against a
      reference distribution, complementing MolProbity's Top8000
      classification. Use ProSMART as the second confirmation when
      the MolProbity tools split on a borderline residue.
    evidence_refs:
      - Joosten2012
    as_of_date: '2026-04-30'

  - id: REC_T05_rotamer_outlier_top_performing
    metric_definition_ref: T05_rotamer_outlier
    tool_ref: ProSMART
    role: top_performing
    rank: 1
    justification: >-
      ProSMART per-residue rotamer comparison is non-cctbx and runs
      against any reference structure (typically the deposited model
      or a higher-resolution comparator).
    as_of_date: '2026-04-30'

  - id: REC_T05_bond_length_rmsz_top_performing
    metric_definition_ref: T05_bond-length_rmsz
    tool_ref: REFMAC5
    role: top_performing
    rank: 1
    justification: >-
      REFMAC5 reports geometry RMSZ in its log against the CCP4
      restraint library — fully independent code base from PHENIX's
      restraint dictionary. The two should agree within ~0.2 σ on
      a well-refined model; > 0.5 σ disagreement indicates the
      restraint libraries differ on which atoms are involved.
    as_of_date: '2026-04-30'

  - id: REC_T05_bond_angle_rmsz_top_performing
    metric_definition_ref: T05_bond-angle_rmsz
    tool_ref: REFMAC5
    role: top_performing
    rank: 1
    justification: Same as bond-length RMSZ — REFMAC5 internal restraint library.
    as_of_date: '2026-04-30'

  - id: REC_T03_r_work_top_performing_refmac
    metric_definition_ref: T03_r-work
    tool_ref: REFMAC5
    role: alternative
    rank: 3
    justification: >-
      Once installed, REFMAC5 is the canonical second-opinion refiner
      (PDB-REDO methodology, Joosten 2012). Re-refine the model with
      REFMAC and report whether R-work / R-free converge within
      ~0.01-0.02 of the agent's PHENIX numbers. Currently rank 3
      (gemmi sfcalc + Servalcat are easier installs); promote to
      rank 1 once REFMAC re-refinement is the default path.
    evidence_refs:
      - Joosten2012
    as_of_date: '2026-04-30'

  - id: REC_T13_completeness_outer_top_performing
    metric_definition_ref: T13_completeness_overall_outer
    tool_ref: aimless
    role: top_performing
    rank: 1
    justification: >-
      CCP4 aimless is the canonical data-processing tool for
      completeness, ⟨I/σ⟩, and CC½ statistics. Catalog T13 oracle
      (catalog notes name it explicitly).
    as_of_date: '2026-04-30'

  # --- T15-T17 (oracle-only tasks; no PHENIX implementation exists) ---------
  # None of these oracles are installed locally yet (see ref/oracle_tools.md
  # "Not installed"), so these are consensus recommendations, not empirical
  # top_performing results within this harness.

  - id: REC_T15_secondary_structure_agreement_top_considered
    metric_definition_ref: T15_secondary_structure_agreement
    tool_ref: DSSP
    role: top_considered
    rank: 1
    justification: >-
      DSSP is the reference implementation for secondary-structure
      assignment. The gradeable T15 metric is three-state agreement
      between two independent assigners, so DSSP is paired with STRIDE
      rather than used alone.
    as_of_date: '2026-07-20'

  - id: REC_T15_secondary_structure_agreement_alternative
    metric_definition_ref: T15_secondary_structure_agreement
    tool_ref: STRIDE
    role: alternative
    rank: 2
    justification: >-
      STRIDE is the independent second assigner in the agreement pair.
      It uses hydrogen-bond energy plus dihedral criteria, so it fails
      differently from DSSP — which is what makes the agreement
      informative rather than tautological.
    as_of_date: '2026-07-20'

  - id: REC_T15_fold_classification_top_considered
    metric_definition_ref: T15_fold_classification
    tool_ref: CATH
    role: top_considered
    rank: 1
    justification: >-
      CATH provides curated, versioned fold assignments for deposited
      entries. Informational rather than gradeable — record the label,
      and treat CATH/SCOPe/ECOD disagreement as the signal.
    as_of_date: '2026-07-20'

  - id: REC_T16_interface_dockq_score_top_considered
    metric_definition_ref: T16_interface_dockq_score
    tool_ref: DockQ
    role: top_considered
    rank: 1
    justification: >-
      DockQ is the community-standard continuous interface-quality
      score and the basis of the CAPRI quality classes; CAPRI class is
      recorded alongside it as the ordinal label.
    as_of_date: '2026-07-20'

  - id: REC_T16_interface_buried_surface_area_top_considered
    metric_definition_ref: T16_interface_buried_surface_area
    tool_ref: PISA/PDBePISA
    role: top_considered
    rank: 1
    justification: >-
      PDBePISA is the reference service for interface area and
      biological-assembly inference, and is the source the deposited
      assembly is judged against.
    as_of_date: '2026-07-20'

  - id: REC_T17_nmr_ensemble_precision_rmsd_top_considered
    metric_definition_ref: T17_nmr_ensemble_precision_rmsd
    tool_ref: wwPDB NMR validation
    role: top_considered
    rank: 1
    justification: >-
      The wwPDB NMR validation report is the deposition-grade source
      for ensemble precision and restraint-violation statistics, and is
      the gold standard named in the T17 catalog entry.
    as_of_date: '2026-07-20'

  - id: REC_T15_secondary_structure_agreement_top_performing
    metric_definition_ref: T15_secondary_structure_agreement
    tool_ref: biotite P-SEA
    role: top_performing
    rank: 1
    justification: >-
      Installed and runnable now (scripts/t15_ss_agreement.py): DSSP vs
      biotite P-SEA three-state agreement. biotite's Cα-geometry P-SEA is
      a different algorithm family from DSSP's H-bond energetics, so the
      agreement is informative rather than tautological. Stands in for
      STRIDE, which is not currently installable via Homebrew.
    as_of_date: '2026-07-21'
